<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive and accessible Emoji Memory Game built with HTML5, CSS3, and JavaScript.">
  <title>Emoji Memory Game</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="controls">
      <label for="lang-select" class="sr-only" data-i18n="selectLanguage">Select Language</label>
      <select id="lang-select" aria-label="Language selector">
        <option value="en-US" selected>EN-US</option>
        <option value="pt-BR">PT-BR</option>
        <option value="es-ES">ES-ES</option>
      </select>

      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle color theme" aria-pressed="true">
        <span id="theme-icon" aria-hidden="true">☀️</span>
      </button>
    </div>
  </header>

  <main class="container">
    <h1 id="game-title" data-i18n="title">MEMORY GAME</h1>
    
    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>

    <section class="game" aria-label="Memory game board"></section>

    <button type="button" id="reset-btn" class="reset" data-i18n="reset">RESET GAME</button>
  </main>

  <script src="./src/script.js"></script>
</body>
</html>
